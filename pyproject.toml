[project]
name = "criticalagent-blueprints"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Kelvin Oteyo", email = "oteyikelvin@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "agentguard",
    "agentsec-bench",
]

[project.scripts]
criticalagent-blueprints = "criticalagent_blueprints:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"


[tool.pytest.ini_options]
pythonpath = ["."]

[tool.uv.sources]
agentsec-bench = { path = "../agentsec-bench", editable = true }
agentguard = { path = "../agentguard", editable = true }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
