name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout criticalagent-blueprints
        uses: actions/checkout@v4
        with:
          path: criticalagent-blueprints

      - name: Checkout agentsec-bench
        uses: actions/checkout@v4
        with:
          repository: samyshyaka/agentsec-bench
          path: agentsec-bench

      - name: Checkout agentguard
        uses: actions/checkout@v4
        with:
          repository: samyshyaka/agentguard
          path: agentguard

      - name: Checkout AgentTrace
        uses: actions/checkout@v4
        with:
          repository: samyshyaka/agenttrace
          path: AgentTrace

      - name: Checkout agentsec-crosswalk
        uses: actions/checkout@v4
        with:
          repository: samyshyaka/agentsec-crosswalk
          path: agentsec-crosswalk

      - name: Checkout agentsec-scorecard
        uses: actions/checkout@v4
        with:
          repository: samyshyaka/agentsec-scorecard
          path: agentsec-scorecard

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        working-directory: criticalagent-blueprints
        run: uv sync

      - name: Run tests
        working-directory: criticalagent-blueprints
        run: uv run pytest -v